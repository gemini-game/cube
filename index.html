<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUBE HELL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cube-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 180px; margin: 0 auto; }
        .cube-cell { aspect-ratio: 1; border: 2px solid #444; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .color-0 { background-color: #f3f4f6; color: #999; }
        .color-1 { background-color: #ef4444; }
        .color-2 { background-color: #facc15; }
        .color-3 { background-color: #22c55e; }
        .color-4 { background-color: #3b82f6; }
        .selected { outline: 4px solid #000; z-index: 10; }
        .log-container { height: 500px; overflow-y: auto; }
        .tab-active { border-bottom: 4px solid #2563eb; color: #2563eb; font-weight: bold; }
        .mode-step { display: none; }
        .mode-step.active { display: block; }
        .brush-active { border-color: #000 !important; transform: scale(1.1); }
    </style>
</head>
<body class="bg-gray-100 p-4">
<div id="app" class="max-w-5xl mx-auto bg-white rounded-xl shadow-2xl p-6">
    <header class="text-center mb-8 border-b pb-4">
        <h1 class="text-3xl font-black uppercase">CUBE HELL</h1>
    </header>
    
    <!-- Prestage: 초기 설정 (수정 없음) -->
    <div id="prestage" class="max-w-md mx-auto py-10">
        <div id="step-1" class="mode-step active space-y-6 text-center">
            <h2 class="text-xl font-bold">1. 관측 단위 설정</h2>
            <div class="grid grid-cols-1 gap-3">
                <button onclick="selectObs(1)" class="w-full p-4 border-2 rounded-xl hover:border-blue-500 font-bold">1개씩 관측</button>
                <button onclick="selectObs(3)" class="w-full p-4 border-2 rounded-xl hover:border-blue-500 font-bold">3개씩 관측</button>
                <button onclick="selectObs(0)" class="w-full p-4 border-2 border-dashed border-red-300 bg-red-50 text-red-700 rounded-xl font-bold">테스트 모드</button>
            </div>
        </div>
        <div id="step-2" class="mode-step space-y-6 text-center">
            <h2 class="text-xl font-bold">2. 게임 진행 방식</h2>
            <div class="grid grid-cols-1 gap-3">
                <button onclick="selectPlay(1)" class="w-full p-4 border-2 rounded-xl hover:border-blue-500 font-bold">수동 질문 모드</button>
                <button onclick="selectPlay(2)" class="w-full p-4 border-2 rounded-xl hover:border-blue-500 font-bold">자동 힌트 모드</button>
            </div>
        </div>
        <div id="step-3" class="mode-step space-y-8 text-center">
            <h2 class="text-xl font-bold">준비 완료</h2>
            <button onclick="initAndStart()" class="w-full py-4 bg-black text-white font-black rounded-xl text-xl uppercase">Game Start</button>
        </div>
    </div>

    <!-- Gamestage: Ask 및 Submit 최적화 적용 구간 -->
    <div id="gamestage" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-5 space-y-6 border-r pr-6">
            <div class="flex border-b text-sm mb-4">
                <button onclick="setTab('search')" id="tab-search" class="flex-1 py-3 tab-active uppercase">Search (Ask)</button>
                <button onclick="setTab('submit')" id="tab-submit" class="flex-1 py-3 uppercase">Submit</button>
            </div>

            <div id="view-section">
                <div class="mb-6 bg-gray-50 p-4 rounded-xl border grid grid-cols-5 gap-1">
                    <button onclick="setView('TOP')" class="v-btn py-2 border rounded bg-white text-xs font-black" id="v-TOP">TOP</button>
                    <button onclick="setView('SOUTH')" class="v-btn py-2 border rounded bg-white text-xs font-black" id="v-SOUTH">SOUTH</button>
                    <button onclick="setView('NORTH')" class="v-btn py-2 border rounded bg-white text-xs font-black" id="v-NORTH">NORTH</button>
                    <button onclick="setView('EAST')" class="v-btn py-2 border rounded bg-white text-xs font-black" id="v-EAST">EAST</button>
                    <button onclick="setView('WEST')" class="v-btn py-2 border rounded bg-white text-xs font-black" id="v-WEST">WEST</button>
                </div>
                <div id="search-grid" class="cube-grid mb-6"></div>
                <button id="btn-ask" onclick="handleAsk()" class="w-full py-4 bg-blue-600 text-white rounded-xl font-black uppercase shadow-lg">Ask</button>
                <button id="btn-next-puzzle" onclick="handlePuzzleNext()" class="hidden w-full py-4 bg-indigo-600 text-white rounded-xl font-black uppercase shadow-lg">Next Hint</button>
            </div>

            <div id="submit-section" class="hidden space-y-6 text-center">
                <div id="target-floor-label" class="inline-block px-4 py-1 bg-red-600 text-white rounded-full text-xs font-black mb-4 uppercase">Target: 3F</div>
                <div id="submit-grid" class="cube-grid mb-8 scale-110"></div>
                <div class="flex justify-center gap-2 bg-gray-50 p-4 rounded-xl border">
                    <button onclick="setBrush(0)" class="w-10 h-10 border-2 rounded-lg color-0 flex items-center justify-center font-black brush-tool" id="brush-0">X</button>
                    <button onclick="setBrush(1)" class="w-10 h-10 border-2 rounded-lg color-1 brush-tool" id="brush-1"></button>
                    <button onclick="setBrush(2)" class="w-10 h-10 border-2 rounded-lg color-2 brush-tool" id="brush-2"></button>
                    <button onclick="setBrush(3)" class="w-10 h-10 border-2 rounded-lg color-3 brush-tool" id="brush-3"></button>
                    <button onclick="setBrush(4)" class="w-10 h-10 border-2 rounded-lg color-4 brush-tool" id="brush-4"></button>
                </div>
                <button onclick="submitAnswer()" class="w-full mt-4 py-4 bg-red-600 text-white rounded-xl font-black uppercase">Submit Answer</button>
            </div>
        </div>

        <div class="lg:col-span-7 flex flex-col">
            <h3 class="font-black text-xl mb-4 border-b-2 border-gray-900 pb-2 uppercase tracking-tighter">Observation Logs</h3>
            <div id="log-list" class="log-container space-y-2"></div>
        </div>
    </div>

    <!-- Teststage: 디버깅용 모드 -->
    <div id="teststage" class="hidden space-y-8">
        <div class="grid grid-cols-3 gap-4" id="test-view"></div>
        <button onclick="location.페이지를 새로고침()" class="
