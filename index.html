<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube Strategy - Enhanced Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-8">

    <div class="max-w-4xl w-full">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-black mb-2 tracking-tighter">CUBE STRATEGY</h1>
            <p class="text-slate-400">관측: **Space** | 제출: **Enter**</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Game Board -->
            <div class="flex flex-col items-center">
                <div id="grid-container" class="grid grid-cols-3 gap-2 bg-slate-800 p-4 rounded-xl shadow-2xl border border-slate-700">
                    <!-- Cells generated by JS -->
                </div>
                
                <div class="mt-8 w-full space-y-4">
                    <div class="flex gap-2">
                        <input type="text" id="ans-input" placeholder="총 블록 개수 입력" 
                            class="flex-1 bg-slate-800 border border-slate-700 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="game.submit()" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded font-bold transition-colors">
                            제출
                        </button>
                    </div>
                    <button onclick="game.ask()" class="w-full bg-slate-700 hover:bg-slate-600 py-3 rounded-lg font-bold transition-all border border-slate-500">
                        선택 좌표 관측 (Space)
                    </button>
                </div>
            </div>

            <!-- Observation Log -->
            <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700 flex flex-col h-[500px]">
                <h2 class="text-lg font-bold mb-4 px-2 border-l-4 border-blue-500">관측 기록</h2>
                <div id="log" class="overflow-y-auto flex-1 pr-2 space-y-2">
                    <p class="text-slate-500 text-center py-10">좌표를 선택하고 스페이스를 누르셈.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const game = {
            grid: [],
            colors: ['bg-red-500', 'bg-blue-500', 'bg-green-500', 'bg-yellow-500'],
            selected: null,
            mode: 3,
            
            init() {
                const urlParams = new URLSearchParams(window.location.search);
                this.mode = parseInt(urlParams.get('mode')) || 3;
                this.generate();
                this.render();
                this.setupKeyboardEvents();
            },

            generate() {
                let success = false;
                let limit = 0;
                while(!success && limit < 500) {
                    this.grid = Array.from({length:3}, () => Array.from({length:3}, () => Array(3).fill(0)));
                    success = true;

                    for(let c=1; c<=4; c++) {
                        let count = 0;
                        let cluster = [];
                        while(count < 5) {
                            let start;
                            if(cluster.length === 0) {
                                start = [Math.floor(Math.random()*3), Math.floor(Math.random()*3), Math.floor(Math.random()*3)];
                            } else {
                                start = this.getAdj(cluster[Math.floor(Math.random()*cluster.length)]);
                            }
                            
                            if(start && this.grid[start[0]][start[1]][start[2]] === 0) {
                                this.grid[start[0]][start[1]][start[2]] = c;
                                cluster.push(start);
                                count++;
                            } else if (cluster.length === 0) continue;
                            else {
                                let available = false;
                                for(let p of cluster) if(this.getAdj(p)) available = true;
                                if(!available) { success = false; break; }
                            }
                        }
                        if(!success) break;
                    }
                    limit++;
                }
            },

            getAdj([z, y, x]) {
                const dirs = [[z+1,y,x],[z-1,y,x],[z,y+1,x],[z,y-1,x],[z,y,x+1],[z,y,x-1]];
                const ads = dirs.filter(([nz,ny,nx]) => 
                    nz>=0 && nz<3 && ny>=0 && ny<3 && nx>=0 && nx<3 && this.grid[nz][ny][nx] === 0
                );
                return ads.length > 0 ? ads[Math.floor(Math.random()*ads.length)] : null;
            },

            setupKeyboardEvents() {
                window.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.ask();
                    } else if (e.code === 'Enter') {
                        this.submit();
                    }
                });
            },

            render() {
                const container = document.getElementById('grid-container');
                container.innerHTML = '';
                for(let y=0; y<3; y++) {
                    for(let x=0; x<3; x++) {
                        const cell = document.createElement('div');
                        const isSelected = this.selected?.[0]===y && this.selected?.[1]===x;
                        cell.className = `w-20 h-20 border border-slate-700 flex items-center justify-center cursor-pointer transition-all duration-200 ${isSelected ? 'bg-slate-700 ring-2 ring-blue-400 scale-105 z-10 shadow-lg' : 'hover:bg-slate-700/50'}`;
                        
                        cell.onclick = () => { 
                            this.selected = [y, x]; 
                            this.render(); 
                        };
                        
                        const colorIdx = this.getTopColor(y, x);
                        if(colorIdx > 0) {
                            const block = document.createElement('div');
                            block.className = `w-14 h-14 rounded-lg ${this.colors[colorIdx-1]} shadow-inner`;
                            cell.appendChild(block);
                        }
                        container.appendChild(cell);
                    }
                }
            },

            getTopColor(y, x) {
                if(this.mode === 1) return this.grid[1][y][x];
                for(let z=0; z<3; z++) {
                    if(this.grid[z][y][x] !== 0) return this.grid[z][y][x];
                }
                return 0;
            },

            ask() {
                if(!this.selected) return;
                const [y, x] = this.selected;
                const log = document.getElementById('log');
                if(log.innerHTML.includes('좌표를 선택하고')) log.innerHTML = '';

                const res = [];
                for(let z=0; z<3; z++) if(this.grid[z][y][x] !== 0) res.push(this.grid[z][y][x]);

                const entry = document.createElement('div');
                entry.className = 'flex items-center gap-3 p-3 bg-slate-800 rounded-lg border border-slate-700 animate-fade-in shadow-sm';
                
                let html = `<span class="text-sm font-mono text-slate-400 bg-slate-900 px-2 py-1 rounded">Y${y} X${x}</span>`;
                if(res.length === 0) {
                    html += `<span class="text-xs text-slate-500">빈 공간</span>`;
                } else {
                    res.forEach(c => {
                        html += `<div class="w-5 h-5 rounded-md ${this.colors[c-1]} shadow-sm"></div>`;
                    });
                }
                entry.innerHTML = html;
                log.prepend(entry);
            },

            submit() {
                const input = document.getElementById('ans-input');
                const val = parseInt(input.value);
                const actual = this.grid.flat(2).filter(v => v > 0).length;

                if(isNaN(val)) return;

                if(val === actual) {
                    alert(`정답! (총 블록: ${actual}개)`);
                    location.페이지를 새로고침();
                } else {
                    alert(`오답! 다시 세어보셈.`);
                    input.value = '';
                    input.focus();
                }
            }
        };

        game.init();
    </script>
</body>
</html>
