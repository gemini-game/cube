<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>큐브 지옥 (Cube Hell)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cube-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 180px; margin: 0 auto; }
        .cube-cell { aspect-ratio: 1; border: 2px solid #444; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; font-size: 1.2rem; user-select: none; border-radius: 4px; }
        .color-0 { background-color: #f3f4f6; color: #999; }
        .color-1 { background-color: #ef4444; color: white; }
        .color-2 { background-color: #facc15; color: black; }
        .color-3 { background-color: #22c55e; color: white; }
        .color-4 { background-color: #3b82f6; color: white; }
        .selected { outline: 3px solid #000; z-index: 10; }
        .log-container { height: 500px; overflow-y: auto; }
        .tab-active { border-bottom: 4px solid #2563eb; color: #2563eb; font-weight: bold; }
        .brush-active { border-color: #000 !important; transform: scale(1.1); }
    </style>
</head>
<body class="bg-gray-100 p-4" onkeydown="handleKey(event)">
<div id="app" class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg p-6">
    <div id="menu" class="text-center py-10 space-y-6">
        <h1 class="text-3xl font-black">CUBE HELL</h1>
        <div class="flex flex-col gap-2 max-w-xs mx-auto">
            <button onclick="startGame(1)" class="p-4 bg-gray-800 text-white font-bold rounded">1개 관측 모드</button>
            <button onclick="startGame(3)" class="p-4 bg-gray-800 text-white font-bold rounded">3개 관측 모드</button>
        </div>
    </div>

    <div id="game" class="hidden grid grid-cols-12 gap-8">
        <div class="col-span-5 space-y-6 border-r pr-6">
            <div class="flex border-b mb-4">
                <button onclick="setTab('search')" id="t-search" class="flex-1 py-2 tab-active">탐색</button>
                <button onclick="setTab('submit')" id="t-submit" class="flex-1 py-2">제출</button>
            </div>
            
            <div id="sec-search">
                <div class="grid grid-cols-5 gap-1 mb-4">
                    <button onclick="setView('TOP')" class="v-btn p-1 border text-xs bg-blue-600 text-white" id="v-TOP">TOP</button>
                    <button onclick="setView('SOUTH')" class="v-btn p-1 border text-xs" id="v-SOUTH">SOUTH</button>
                    <button onclick="setView('NORTH')" class="v-btn p-1 border text-xs" id="v-NORTH">NORTH</button>
                    <button onclick="setView('EAST')" class="v-btn p-1 border text-xs" id="v-EAST">EAST</button>
                    <button onclick="setView('WEST')" class="v-btn p-1 border text-xs" id="v-WEST">WEST</button>
                </div>
                <div id="grid-search" class="cube-grid mb-6"></div>
                <button onclick="doAsk()" class="w-full py-4 bg-blue-600 text-white font-bold rounded">관측 (Space/Enter)</button>
            </div>

            <div id="sec-submit" class="hidden text-center">
                <div id="floor-tag" class="inline-block px-3 py-1 bg-red-600 text-white text-xs font-bold mb-4">3F 작성 중</div>
                <div id="grid-submit" class="cube-grid mb-6"></div>
                <div class="flex justify-center gap-2 mb-6">
                    <button onclick="setBrush(0)" id="b-0" class="w-10 h-10 border-2 color-0 flex items-center justify-center font-bold">X</button>
                    <button onclick="setBrush(1)" id="b-1" class="w-10 h-10 border-2 color-1 brush-active"></button>
                    <button onclick="setBrush(2)" id="b-2" class="w-10 h-10 border-2 color-2"></button>
                    <button onclick="setBrush(3)" id="b-3" class="w-10 h-10 border-2 color-3"></button>
                    <button onclick="setBrush(4)" id="b-4" class="w-10 h-10 border-2 color-4"></button>
                </div>
                <button onclick="doSubmit()" class="w-full py-4 bg-red-600 text-white font-bold rounded">제출 (Space/Enter)</button>
            </div>
        </div>

        <div class="col-span-7">
            <h2 class="font-bold border-b-2 mb-4">로그</h2>
            <div id="logs" class="log-container space-y-2 text-sm"></div>
        </div>
    </div>
</div>

<div id="modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">
    <div class="bg-white p-8 rounded-lg max-w-xs w-full text-center">
        <h2 id="m-title" class="text-xl font-bold mb-4"></h2>
        <button onclick="closeModal()" class="w-full py-2 bg-black text-white font-bold rounded">확인</button>
    </div>
</div>

<script>
let grid = [], obsMode = 1, currentView = 'TOP', sel = [], brush = 1, userG = [[0,0,0],[0,0,0],[0,0,0]], curTab = 'search', curF = 2;

function gen() {
    grid = Array.from({length:3}, () => Array.from({length:3}, () => [0,0,0]));
    let cells = [];
    for(let z=0; z<3; z++) for(let y=0; y<3; y++) for(let x=0; x<3; x++) cells.push({x,y,z});
    cells.sort(() => Math.random() - 0.5);
    let target = cells.slice(0, 20);
    target.forEach((p, i) => {
        let color = (i % 4) + 1;
        grid[p.z][p.y][p.x] = color;
    });
}

function handleKey(e) {
    if(document.getElementById('modal').style.display === 'flex') {
        if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); closeModal(); }
        return;
    }
    if(e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if(curTab === 'search') doAsk(); else doSubmit();
    }
}

function startGame(m) {
    obsMode = m; gen();
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    initUI();
}

function initUI() {
    const gs = document.getElementById('grid-search');
    gs.innerHTML = '';
    for(let i=1; i<=9; i++) {
        let d = document.createElement('div');
        d.className = 'cube-cell color-0'; d.innerText = i;
        d.onclick = () => {
            let p = sel.indexOf(i);
            if(p > -1) { sel.splice(p, 1); d.classList.remove('selected'); }
            else if(sel.length < obsMode) { sel.push(i); d.classList.add('selected'); }
            else if(obsMode === 1) {
                sel = [i]; document.querySelectorAll('#grid-search .cube-cell').forEach(el=>el.classList.remove('selected'));
                d.classList.add('selected');
            }
        };
        gs.appendChild(d);
    }
    const gsub = document.getElementById('grid-submit');
    gsub.innerHTML = '';
    for(let i=0; i<9; i++) {
        let d = document.createElement('div');
        d.className = 'cube-cell color-0'; d.innerText = 'X';
        d.onclick = () => {
            let r = Math.floor(i/3), c = i%3;
            userG[r][c] = brush;
            d.className = 'cube-cell color-' + brush;
            d.innerText = brush === 0 ? 'X' : '';
        };
        gsub.appendChild(d);
    }
}

function setView(v) {
    currentView = v;
    document.querySelectorAll('.v-btn').forEach(b => b.classList.remove('bg-blue-600', 'text-white'));
    document.getElementById('v-'+v).classList.add('bg-blue-600', 'text-white');
    sel = []; document.querySelectorAll('#grid-search .cube-cell').forEach(el=>el.classList.remove('selected'));
}

function setTab(t) {
    curTab = t;
    document.getElementById('t-search').classList.toggle('tab-active', t==='search');
    document.getElementById('t-submit').classList.toggle('tab-active', t==='submit');
    document.getElementById('sec-search').classList.toggle('hidden', t!=='search');
    document.getElementById('sec-submit').classList.toggle('hidden', t!=='submit');
}

function setBrush(c) {
    brush = c;
    document.querySelectorAll('[id^="b-"]').forEach(b=>b.classList.remove('brush-active'));
    document.getElementById('b-'+c).classList.add('brush-active');
}

function doAsk() {
    if(sel.length < obsMode) return;
    let results = sel.map(n => getRay(currentView, n));
    addLog(currentView, sel, results);
    sel = []; document.querySelectorAll('#grid-search .cube-cell').forEach(el=>el.classList.remove('selected'));
}

function getRay(v, n) {
    let idx = n - 1, r = Math.floor(idx/3), c = idx%3, x, y, z, dx=0, dy=0, dz=0;
    if(v==='TOP'){x=c; y=r; z=2; dz=-1;}
    else if(v==='SOUTH'){x=c; y=2; z=2-r; dy=-1;}
    else if(v==='NORTH'){x=2-c; y=0; z=2-r; dy=1;}
    else if(v==='EAST'){x=2; y=2-c; z=2-r; dx=-1;}
    else if(v==='WEST'){x=0; y=c; z=2-r; dx=1;}
    for(let i=0; i<3; i++) {
        let val = grid[z][y][x];
        if(val > 0) return val;
        x+=dx; y+=dy; z+=dz;
    }
    return 0;
}

function addLog(v, idxs, res) {
    const l = document.getElementById('logs');
    let div = document.createElement('div');
    div.className = 'p-2 bg-white border rounded flex justify-between items-center';
    let counts = [0,0,0,0,0]; res.forEach(c => counts[c]++);
    let colorsDiv = document.createElement('div');
    colorsDiv.className = 'flex gap-1';
    for(let i=1; i<=4; i++) for(let j=0; j<counts[i]; j++) {
        let b = document.createElement('div'); b.className = 'w-4 h-4 rounded color-'+i;
        colorsDiv.appendChild(b);
    }
    div.innerHTML = `<span><b>${v}</b> (${idxs.join(',')})</span>`;
    div.appendChild(colorsDiv);
    l.prepend(div);
}

function doSubmit() {
    let correct = true;
    for(let y=0; y<3; y++) for(let x=0; x<3; x++) {
        if(grid[curF][y][x] !== userG[y][x]) correct = false;
    }
    if(correct) {
        if(curF > 0) {
            alertModal('정답', () => {
                curF--;
                document.getElementById('floor-tag').innerText = (curF+1)+'F 작성 중';
                userG = [[0,0,0],[0,0,0],[0,0,0]]; initUI(); setTab('search');
            });
        } else {
            alertModal('정답', () => location.페이지를 새로고침());
        }
    } else {
        alertModal('오답');
    }
}

let modalCb = null;
function alertModal(txt, cb) {
    document.getElementById('m-title').innerText = txt;
    document.getElementById('modal').style.display = 'flex';
    modalCb = cb;
}
function closeModal() {
    document.getElementById('modal').style.display = 'none';
    if(modalCb) modalCb();
    modalCb = null;
}
</script>
</body>
</html>
